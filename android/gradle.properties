org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 默认关闭 Flutter 插件对 abiFilters 的自动覆盖（插件默认会把 arm64/armeabi/x86_64 全加回）。
# 开启后 app/build.gradle.kts defaultConfig.ndk.abiFilters 完全由我们控制（只打两种真机 ABI，
# 剔除 x86_64 模拟器库）。如需临时让插件接管，命令行传 -Pdisable-abi-filtering=false 覆盖。
disable-abi-filtering=true
